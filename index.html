<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K2-Linux</title>
    <style>
        /* CSS Reset e Variabili */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary-blue: #0066ff;
            --primary-hover: #0052cc;
            --secondary-bg: #f8fafc;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        /* Header e Logo */
        header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            color: var(--primary-blue);
        }

        /* Hero Section */
        main {
            text-align: center;
            max-width: 600px;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.1;
        }

        .hero-subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Gruppo Bottoni */
        .cta-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Bottone Primario: Scarica Stage3 */
        .btn-primary {
            background-color: var(--primary-blue);
            color: #ffffff;
            border: 2px solid var(--primary-blue);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Bottone Secondario: Handbook */
        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-bg);
            border-color: var(--text-color);
            transform: translateY(-1px);
        }

        /* Footer */
        footer {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .hero-title {
                font-size: 2.25rem;
            }
            .cta-group {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="logo">K2<span>-Linux</span></a>
    </header>

    <!-- Contenuto Principale -->
    <main>
        <div>
            <h1 class="hero-title">K2-Linux</h1>
            <p class="hero-subtitle">Essenziale, performante e personalizzabile. Scarica l'archivio base o consulta la guida ufficiale per iniziare.</p>
        </div>

        <!-- Bottoni -->
        <div class="cta-group">
            <a href="https://github.com/System686/K2-linux/releases/download/v0.5/k2-core.tar.gz" class="btn btn-primary">Scarica Stage3</a>
            <a href="handbook.html" class="btn btn-secondary">Handbook</a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        &copy; 2026 K2-Linux Project. Tutti i diritti riservati.
    </footer>

</body>
</html>
