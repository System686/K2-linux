<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K2-Linux</title>
  <style>
    /* Reset essenziale e palette di colori scura */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #0f172a; /* Blu scuro */
      color: #f8fafc; /* Testo chiaro */
      line-height: 1.6;
    }

    a {
      color: #00a3ff; /* Azzurro K2 */
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /* Container centrale */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Header e Navigazione */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #1e293b;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      font-family: monospace;
    }

    .logo span {
      color: #00a3ff;
    }

    nav a {
      color: #94a3b8;
      margin-left: 20px;
      font-weight: 600;
    }

    nav a:hover {
      color: #00a3ff;
    }

    /* Hero / Messaggio principale */
    .hero {
      text-align: center;
      padding: 60px 0 40px 0;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 15px;
      color: #ffffff;
    }

    .hero p {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    /* Bottoni di azione */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      text-decoration: none !important;
    }

    .btn-primary {
      background-color: #00a3ff;
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: #38bdf8;
    }

    .btn-secondary {
      background-color: #1e293b;
      color: #ffffff;
      border: 1px solid #334155;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    /* Sezione Download Semplice */
    .download-section {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 30px;
      margin: 40px 0;
      border: 1px solid #334155;
    }

    .download-section h2 {
      align-content: center;
      margin-bottom: 15px;
      color: #00a3ff;
    }

    .download-list {
      list-style: none;
    }

    .download-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #334155;
    }

    .download-list li:last-child {
      border-bottom: none;
    }

    footer {
      text-align: center;
      padding: 30px 0;
      color: #64748b;
      font-size: 0.9rem;
      border-top: 1px solid #1e293b;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo"><span>K2</span>-LINUX</div>
      <nav>
        <a href="#about">Wiki</a>
        <a href="#downloads">Download</a>
        <a href="#docs">Handbook</a>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero" id="about">
      <h1>K2-Linux</h1>
      <p>Una distribuzione Linux essenziale, ottimizzata e compilata dai sorgenti. Controllo totale sul tuo sistema.</p>
      <div class="btn-group">
        <a href="https://github.com/System686/K2-linux/releases/download/v0.9_unstable/k2-base_system-amd64.tar.gz" class="btn btn-primary">Download Now K2-linux</a>
        <a href="#docs" class="btn btn-secondary">Read Handbook</a>
      </div>
    </section>

    <section class="download-section" id="downloads">
      <h2>K2-Linux, The Future Of DIY Linux Distros</h2>
    </section>

    <footer>
      <p>&copy; 2026 K2-Linux Project. Progetto Open Source.</p>
    </footer>
  </div>

</body>
</html>
